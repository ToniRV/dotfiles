- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    ~/.bashrc:
    ~/.bash_profile:
    ~/.bash.d:
    ~/.gitconfig:
    ~/.inputrc:
    ~/.vim:
    ~/.vimrc:

- shell:
  - git submodule update --init --recursive
  -
    command: bash ./bin/install_powerline_fonts
    stdout: true
  - brew install vim
  - brew install universal-ctags
  - brew install zoxide
  - vim +PluginInstall +qall
