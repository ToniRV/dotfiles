# Common to every OS. `./install` then runs install.<os>.conf.yaml.
- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    ~/.bashrc:
    ~/.bash_profile:
    ~/.bash.d:
    ~/.gitconfig:
    ~/.config/git/ignore: gitignore
    ~/.inputrc:
    ~/.vim:
    ~/.vimrc:

- shell:
  - command: git submodule update --init --recursive
    description: Updating submodules
  - command: bash ./bin/install_powerline_fonts
    description: Installing powerline fonts
    stdout: true
    stderr: true
